name: gui-test
# Manual test of the GUI track only: baseline du + GUI apps on the chosen profile. Results are uploaded as artifacts,
# never published. Use it before changing a GUI harness (bench/gui/) or a GUI app version.
on:
  workflow_dispatch:
    inputs:
      profile: {description: "smoke or full", default: full, type: choice, options: [full, smoke]}
      datasets: {description: "comma list overriding the profile's datasets (optional)", default: "", type: string}
permissions: {contents: read}
jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, label: gh-ubuntu-latest-x64, tools: "du,qdirstat,k4dirstat"}
          - {os: macos-14, label: gh-macos-14-arm64, tools: "du,omnidisksweeper,grandperspective,diskinventoryx"}
          - {os: windows-latest, label: gh-windows-latest-x64, tools: "du-sysinternals,windirstat,spacesniffer"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env: {DSB_RUNNER_LABEL: "${{ matrix.label }}", PROFILE: "${{ inputs.profile || 'full' }}"}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Prepare (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq time
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends qdirstat k4dirstat at-spi2-core gir1.2-atspi-2.0 python3-gi xvfb dbus-x11 x11-utils x11-xserver-utils  # GUI track (apt versions of the runner's Ubuntu release)
          bash bench/gui/linux_session.sh >> $GITHUB_ENV  # Xvfb + D-Bus + AT-SPI bus for the GUI harnesses
          if sudo mkdir -p /mnt/dsb 2>/dev/null && sudo chown "$USER" /mnt/dsb; then echo "DSB_DATA=/mnt/dsb" >> $GITHUB_ENV; else echo "DSB_DATA=$RUNNER_TEMP/dsb" >> $GITHUB_ENV; fi
      - name: Prepare (macOS) - dedicated APFS disk image for cold-cache runs
        if: runner.os == 'macOS'
        run: |
          python -m pip install --quiet pyobjc-framework-Quartz pyobjc-framework-ApplicationServices pyobjc-framework-Cocoa  # GUI harness
          IMG="$RUNNER_TEMP/dsb.sparseimage"; MNT="$RUNNER_TEMP/dsbmnt"; mkdir -p "$MNT"
          hdiutil create -size 16g -type SPARSE -fs "Case-sensitive APFS" -volname dsb "$IMG"
          hdiutil attach "$IMG" -mountpoint "$MNT" -nobrowse -noverify -owners on
          sudo mdutil -i off "$MNT" || true; touch "$MNT/.metadata_never_index"
          echo "DSB_DMG=$IMG" >> $GITHUB_ENV; echo "DSB_MNT=$MNT" >> $GITHUB_ENV; echo "DSB_DATA=$MNT/data" >> $GITHUB_ENV
      - name: Prepare (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install psutil
          echo "DSB_DATA=$RUNNER_TEMP/dsb" >> $GITHUB_ENV
      - uses: actions/cache@v4
        if: runner.os == 'macOS'
        with: {path: .tools, key: "tools-${{ matrix.os }}-${{ hashFiles('bench/install.py') }}"}
      - name: Install pinned tools
        run: python bench/install.py
      - name: Run GUI track
        run: python bench/run.py --profile "$PROFILE" --tools "${{ matrix.tools }}" ${{ inputs.datasets && format('--datasets {0}', inputs.datasets) || '' }} --out "gui-test/$DSB_RUNNER_LABEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "gui-test-${{ matrix.label }}", path: gui-test/}
